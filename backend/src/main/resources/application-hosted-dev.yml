# Public DEV uses authenticated users, never the loopback dev auth stub.
spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
app:
  db-environment: DEV
  supabase:
    jwks-uri: ${DEV_SUPABASE_URL}/auth/v1/.well-known/jwks.json
    issuer: ${DEV_SUPABASE_URL}/auth/v1
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  workflow-development:
    owner-id: ${APP_DEV_USER_ID}
    token-sha256: ${WORKFLOW_DEV_TOKEN_SHA256:}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
