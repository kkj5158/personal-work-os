spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Safe by default in every environment; nothing in this codebase calls
    # Flyway clean today, and it must never be reachable in prod.
    clean-disabled: true

app:
  # Absence backfill scheduler (see docs/backend/work-record.md). Daily at
  # 01:00 Asia/Seoul, safely after the day boundary. Window is bounded so a
  # long-dormant account never triggers an unbounded historical scan.
  absence-backfill-cron: "0 0 1 * * *"
  absence-backfill-window-days: 90
