plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kafka'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation platform('software.amazon.awssdk:bom:2.31.77')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// OFL-licensed deployment font, fetched from a pinned upstream revision into build output.
// No font binary is checked into Git or copied into user evidence archives.
tasks.register('studyFont') {
    def destination = layout.buildDirectory.dir('study-font')
    outputs.dir(destination)
    doLast {
        def hashes = ['NanumGothic-Regular.ttf':'76f45ef4a6bcff344c837c95a7dcc26e017e38b5846d5ae0cdcb5b86be2e2d31',
                      'OFL.txt':'eeacf16032901d0ed0456876ec77b8f0fda6b3fecec7d972f8543eb602e6c30f']
        hashes.each { name, expected ->
            def file = destination.get().file(name).asFile
            file.parentFile.mkdirs()
            if (!file.exists()) new URI('https://raw.githubusercontent.com/google/fonts/cc39c4c2c304bc368c9b7c311ea2bcc6013299fe/ofl/nanumgothic/' + name).toURL().withInputStream { input -> file.withOutputStream { it << input } }
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException('STUDY font integrity mismatch')
        }
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('studyFont')
    from(layout.buildDirectory.dir('study-font')) { into 'study-font' }
}
