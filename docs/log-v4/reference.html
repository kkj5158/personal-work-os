.media-slide{border:0;background:#f5f5f5;border-radius:11px;overflow:hidden;min-width:0;min-height:0;max-height:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:zoom-in}
.media-slide img{display:block;width:100%;height:auto;max-height:320px;object-fit:contain;object-position:center center;transition:filter .15s}
.media-slide:hover img{filter:brightness(.97)}
.post-media-carousel.single-photo .media-slide{height:auto;max-height:none;min-height:0}
.post-media-carousel.single-photo .media-slide img{width:100%;height:auto;max-height:470px;max-width:100%;object-fit:contain}
.media-carousel-controls{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:9px}
.media-carousel-arrow{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:1px solid #e2e2e2;background:white;color:#222}
.media-carousel-arrow svg{height:16px;width:16px}
.media-carousel-arrow:hover:not(:disabled){background:#f1f1f1}
.media-carousel-arrow:disabled{opacity:.27}
.media-carousel-count{min-width:52px;text-align:center;font-size:11.5px;color:#888;font-variant-numeric:tabular-nums}
.media-album{border-bottom:1px solid var(--line);padding:18px 23px 15px}
.media-album .post-media-carousel{margin-bottom:2px}
.media-album-header{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.media-album-header b{font-size:13px}
.media-album-header time{font-size:12px;color:#999}
.media-album-summary{font-size:12px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:9px}
.media-album .media-slide{min-height:0}
@media(max-width:620px){
 .mobile-nav{grid-template-columns:repeat(2,1fr)}
 .media-carousel-stage{gap:6px}
 .media-slide,.media-album .media-slide{min-height:0;max-height:none}
 .media-slide img{max-height:380px}
 .post-media-carousel.single-photo .media-slide img{max-height:460px}
 .media-album{padding:16px}
}
</style>

function normalizeStore(input){
 const raw=Array.isArray(input?.profiles)?input.profiles:null;
 if(raw&&raw.length){
  const used=new Set();const profiles=raw.slice(0,20).map(p=>{
   const id=typeof p?.id==='string'&&p.id.length<130&&!used.has(p.id)?p.id:uid();used.add(id);
   return asProfileEntry(p,id);
  });
  const activeProfileId=profiles.some(p=>p.id===input.activeProfileId)?input.activeProfileId:profiles[0].id;
  return {version:3,activeProfileId,profiles};
 }
 const first=asProfileEntry(input?.profile?input:seed(),uid());
 return {version:3,activeProfileId:first.id,profiles:[first]};
}

function postHtml(p,option={}){const expanded=expandedReplies.has(p.id),replyList=expanded?p.replies:p.replies.slice(0,1),editing=editingPost===p.id,showMenu=openOptions===p.id;return `<article class="post" data-post="${esc(p.id)}"><div class="post-grid"><div>${avatar('avatar-feed')}${p.replies.length&&expanded?'<div class="reply-connector" aria-hidden="true"></div>':''}</div><div><div class="post-meta-line"><span class="post-name">${esc(db.profile.name)}</span><time class="post-date" title="${new Date(p.createdAt).toLocaleString('ko-KR')}">${age(p.createdAt)}</time>${p.updatedAt?'<span class="post-date">· 수정됨</span>':''}<div class="post-menu-wrap"><button class="icon-btn" data-action="more" data-id="${esc(p.id)}" aria-label="게시글 메뉴" aria-expanded="${showMenu}">${symbol('more')}</button>${showMenu?`<div class="post-options" role="menu">${pendingDelete===p.id?`<div style="font-size:12px;padding:9px">정말 삭제할까요?</div><button class="danger" data-action="confirm-delete" data-id="${esc(p.id)}">확인 · 삭제</button><button data-action="cancel-delete" data-id="${esc(p.id)}">취소</button>`:`<button data-action="edit" data-id="${esc(p.id)}">${symbol('edit')} 글 수정</button><button data-action="pin" data-id="${esc(p.id)}">${symbol('pin')} ${p.pinned?'고정 해제':'상단 고정'}</button><button data-action="save" data-id="${esc(p.id)}">${symbol('bookmark')} ${p.saved?'저장 취소':'저장하기'}</button><button data-action="archive" data-id="${esc(p.id)}">${symbol('archive')} ${p.archived?'보관 해제':'보관함으로 이동'}</button><button data-action="copy" data-id="${esc(p.id)}">${symbol('copy')} 글 복사</button><button class="danger" data-action="delete" data-id="${esc(p.id)}">${symbol('x')} 삭제</button>`}</div>`:''}</div></div>${option.context?`<div class="subtle-line">${esc(option.context)}</div>`:''}${p.pinned?`<div class="subtle-line pinmark">${symbol('pin')} 고정된 기록</div>`:''}${editing?inlineEditor(p):`<div class="post-body editable" role="button" tabindex="0" data-action="edit" data-id="${esc(p.id)}" title="클릭하여 바로 수정">${es  const albums=postSort(posts.filter(p=>p.images.length));

function renderInsights(){const p=activePosts(),replies=p.reduce((n,x)=>n+x.replies.length,0),photos=p.reduce((n,x)=>n+x.images.length,0),liked=p.filter(x=>x.liked).length,now=Date.now(),bar=Array.from({length:7},(_,i)=>{const day=new Date(now);day.setHours(0,0,0,0);day.setDate(day.getDate()-(6-i));return {day:day.toLocaleDateString('ko-KR',{weekday:'short'}),count:p.filter(post=>post.createdAt>=day.getTime()&&post.createdAt<day.getTime()+86400000).length};});const peak=Math.max(1,...bar.map(b=>b.count));return `<section class="stat-sheet"><h2>내 기록 인사이트</h2><p>소셜 인사이트 대신 오직 내가 쌓은 기록만 집계합니다.</p><div class="stat-grid">${[[p.length,'전체 게시글'],[replies,'내 답글'],[photos,'첨부한 사진'],[liked,'좋아요 표시']].map(([n,label])=>`<div class="stat-item"><b>${n}</b><span>${label}</span></div>`).join('')}</div><h2 style="font-size:15px;margin-top:35px">최근 7일 기록</h2><div class="days-bars">${bar.map(b=>`<div class="bar-col" title="${b.day} ${b.count}개"><span style="font-size:11px;color:#888">${b.count||''}</span><div class="bar" style="height:${Math.max(5,Math.round(b.count/peak*105))}px"></div><span class="bar-label">${b.day}</span></div>`).join('')}</div></section>`;}
function render(){const main=$('#main-view');const titles={profile:db.profile.handle,search:'검색',activity:'활동',insights:'인사이트',saved:'저장됨',liked:'좋아요',archive:'보관함'};$('#center-title').textContent=titles[view]||'LOG';main.innerHTML=view==='profile'?renderProfile():view==='search'?renderSearch():view==='activity'?renderActivity():view==='insights'?renderInsights():renderFiltered();$$('[data-nav]').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===view));const quick=avatar('avatar-sm');$('#header-profile-switch').innerHTML=`${quick}<span>${esc(db.profile.handle)}</span>${symbol('chevron')}`;$('#side-profile-switch').innerHTML=`${quick}<span class="profile-side-title"><b>${esc(db.profile.name)}</b><small>@${esc(db.profile.handle)}</small></span>${symbol('chevron')}`;$('#mobile-profile-switch').innerHTML=quick;if(view==='profile'&&composerOpen){const ta=$('#compose-input');if(ta){fit(ta);updateComposerAction();}}if(editingPost){const ta=$('.post-edit-input');if(ta){fit(ta);}}if(editingReply){const ta=$('.reply-edit-input');if(ta){fit(ta);}}}

async function shrink(file,max=1600){if(!file?.type.startsWith('image/'))throw new Error('이미지만 첨부할 수 있습니다.');if(file.size>18*1024*1024)throw new Error('18MB 이하의 이미지만 첨부할 수 있습니다.');const raw=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('사진을 읽지 못했습니다.'));reader.readAsDataURL(file);});const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('사진 형식을 지원하지 않습니다.'));image.src=raw;});const scale=Math.min(1,max/Math.max(image.width,image.height));const can=document.createElement('canvas');can.width=Math.max(1,Math.round(image.width*scale));can.height=Math.max(1,Math.round(image.height*scale));can.getContext('2d').drawImage(image,0,0,can.width,can.height);return can.toDataURL('image/jpeg',.78);}

async function importBackup(file){

  const oldStore=store;

   if(!confirm(`기존의 모든 프로필을 백업 파일의 ${next.profiles.length}개 프로필로 교체할까요? 현재 모든 기록이 교체됩니다.`))return;
   store=next;
  }else{

   const replacement=asProfileEntry(parsed,db.id);

  }

}
