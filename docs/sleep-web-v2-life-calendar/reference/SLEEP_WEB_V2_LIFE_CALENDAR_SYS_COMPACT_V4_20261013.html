/* Sleep-first calendar refinement · visually derived from LIFE OS Exercise Calendar, but remains a Sleep-owned view. */
:root{--cal-sleep:#8268b7;--cal-sleep-soft:#ede8fc;--cal-nap:#2b9775;--cal-nap-soft:#e2f5ee}
.week-layout{grid-template-columns:minmax(0,1fr) 296px;gap:14px}
.refined-toolbar{border-bottom:1px solid #e5eaf2;padding-bottom:12px;margin-bottom:15px}
.cal-main-panel{border-color:#dde5f0;box-shadow:0 4px 24px #223c5a05}
.refined-head{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.refined-head p{margin:4px 0 0!important;line-height:1.6}
.refined-chart{padding:14px 15px 8px;max-height:none;overflow-x:auto}
.refined-timeline{grid-template-columns:64px repeat(7,minmax(110px,1fr));min-width:865px;border-radius:9px;border:1px solid #dde4ed}
.refined-timeline .timeline-head-axis{height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#596e87;font-weight:700}
.refined-timeline .timeline-head-axis small{font-size:9px;color:#98a6b9;font-weight:500}
.refined-timeline .day-head{height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 3px;background:#f8fafd;gap:4px}
.refined-timeline .day-head strong{font-size:11px;font-weight:700;color:#596b84;white-space:nowrap}
.refined-timeline .day-head span{font-size:10px;font-weight:550;color:#8c9bae;white-space:nowrap}
.refined-timeline .day-head.now{background:#eef3ff;border-bottom:2px solid #6585e8}
.refined-timeline .day-head.now strong{color:#3159bf}
.refined-timeline .day-head.now span{color:#496ec6}
.refined-timeline .time-axis,.refined-timeline .timeline-day{height:624px}
.refined-timeline .time-axis{background:#f8fafd;border-right:1px solid #dde5ef}
.refined-timeline .axis-label{font-size:11px;letter-spacing:-.15px;left:7px;color:#8593a8;font-variant-numeric:tabular-nums;background:#f8fafd;padding:0 3px;z-index:1}
.refined-timeline .axis-label.emphasis{font-weight:700;color:#566b86}
.refined-timeline .axis-label.midnight-label{color:#476dd3;font-weight:750}
.refined-timeline .timeline-day.refined-day{background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(100% / 24 - 1px),#e7edf5 calc(100% / 24 - 1px),#e7edf5 calc(100% / 24));border-right:1px solid #e4eaf2}
.refined-timeline .timeline-day.refined-day.is-today{background-color:#fafbff}
.refined-timeline .night-tone{position:absolute;top:8.333%;height:54.167%;inset-inline:0;background:linear-gradient(#f7f4ff55,#f4f6ff25);pointer-events:none}
.refined-timeline .midnight-marker{position:absolute;top:25%;left:0;right:0;height:1px;border-top:1px dashed #8aa2d2;z-index:1;pointer-events:none}
.refined-timeline .midnight-marker span{position:absolute;right:3px;top:-14px;font-size:9px;color:#7c92bd;opacity:.75}
.refined-timeline .time-block.refined{left:6px;right:6px;background:linear-gradient(135deg,#f1edfc,#e4dcf8);border:1px solid #b9a9e4;border-left:3px solid var(--cal-sleep);border-radius:6px;box-shadow:0 2px 5px #5e518211;color:#56417c;min-height:13px}
.refined-timeline .time-block.refined.nap{background:linear-gradient(135deg,#f0fbf6,#dcf3e9);border-color:#9ccfbb;border-left-color:var(--cal-nap);color:#226b55}
.refined-timeline .time-block.refined:hover{filter:saturate(1.12);box-shadow:0 3px 12px #37476a2b;z-index:7}

function avg(recs){let night=recs.filter(r=>r.kind==='night'&&period(r)>0),nap=recs.filter(r=>r.kind==='nap'&&period(r)>0);let mean=a=>a.length?Math.round(a.reduce((x,r)=>x+period(r),0)/a.length):null;return {night:mean(night),nap:mean(nap),nightCount:night.length,napCount:nap.length,nightDays:new Set(night.map(recordDay)).size}}

function weekBlocks(day){
  // Sleep-day view = previous day 18:00 through selected wake day 18:00.
  // Each block references exactly one source record ID. A 00:00 crossing is not duplicated.
  const origin=mins(add(day,-1)+'T18:00'),span=1440;
  const visible=S.records.filter(r=>mins(r.start)<origin+span&&mins(r.end)>origin).sort((a,b)=>a.kind===b.kind?mins(a.start)-mins(b.start):a.kind==='night'?-1:1);
  return visible.map(r=>{
    const a=mins(r.start)-origin,b=mins(r.end)-origin;
    const lo=Math.max(0,a),hi=Math.min(span,b),top=lo/span*100,height=Math.max(1,(hi-lo)/span*100);
    const st=r.start.slice(11,16),en=r.end.slice(11,16),nap=r.kind==='nap',shortNap=nap&&hi-lo<=75;
    const label=nap?'낮잠':'야간 수면';
    const tooltip=`${label} | ${r.start.replace('T',' ')} → ${r.end.replace('T',' ')} | ${pretty(period(r))} | 동일 원본 ${r.id}`;
    return `<div class="time-block refined ${nap?'nap':''} ${shortNap?'compact':''} ${S.editor?.id===r.id?'selected':''}" style="top:${top}%;height:${height}%" data-id="${r.id}" data-action="edit" data-source-id="${r.id}" tabindex="0" role="button" aria-label="${safe(tooltip)}" title="${safe(tooltip)}"><span class="block-handle top" data-edge="start" title="시작 시각 변경"></span>${shortNap?`<span class="compact-label">${st}–${en} <b>${short(period(r))}</b></span>`:`<div class="block-content"><b>${nap?'낮잠':'수면'} <small>${short(period(r))}</small></b><span>${a<0?'↥ ':''}${st} <em>→</em> ${en}${b>span?' ↧':''}</span></div>`}<span class="block-handle bottom" data-edge="end" title="종료 시각 변경"></span></div>`;
  }).join('');
}

function civilDayLanes(d){
  // Display-only actual civil-day segments. Does not duplicate the source record.
  const a=mins(d+'T00:00'),b=a+1440;
  return S.records.filter(r=>mins(r.start)<b&&mins(r.end)>a).map(r=>{
    const s=Math.max(0,mins(r.start)-a),e=Math.min(1440,mins(r.end)-a);
    return {r,left:s/1440*100,width:(e-s)/1440*100};
  });
}

function records(){return `${title('LIFE OS / SLEEP','수면','야간 수면과 낮잠의 시간대 분포를 자세히 확인하고 주간 그래프에서 바로 수정합니다.',btn('new','+ 야간 수면','primary','data-kind="night"')+btn('new','+ 낮잠 기록','','data-kind="nap"'))}<div class="tabline"><div class="tabs" role="tablist" aria-label="수면 기록 보기">${[['daily','일별 기록'],['weekly','주간 편집'],['monthly','월간 달력']].map(([t,l])=>`<button class="tab ${S.tab===t?'active':''}" data-action="tab" data-tab="${t}" role="tab" aria-selected="${S.tab===t}">${l}</button>`).join('')}</div><span class="tiny muted">LIFE OS 통합 캘린더는 왼쪽 별도 메뉴에서 확인</span></div>${S.tab==='daily'?daily():S.tab==='weekly'?weekly():monthly()}`}
function statsBars(days){let arr=Array.from({length:days},(_,i)=>add(today,i+1-days));return `<div class="chart-row">${arr.map(d=>{let n=sum(d,'night')||0,p=sum(d,'nap')||0;return `<button class="spark-col" data-action="go-day" data-date="${d}" title="${d} · 야간 ${pretty(n)} / 낮잠 ${pretty(p)}"><span class="spark-nap" style="height:${p/720*145}px"></span><span class="spark-night" style="height:${n/720*145}px"></span><small>${d.slice(8)}</small></button>`}).join('')}</div>`}
function statistics(){let a=inRange(add(today,1-S.stat),today),v=avg(a);return `${title('SLEEP / STATISTICS','수면 통계','기록이 있는 날과 회차를 기준으로 수면 평균을 확인합니다.',btn('go-week','주간 편집으로 이동'))}<div class="date-toolbar"><div class="tools">${btn('stat-period','최근 7일',S.stat===7?'active':'','data-days="7"')}${btn('stat-period','최근 14일',S.stat===14?'active':'','data-days="14"')}${btn('stat-period','최근 30일',S.stat===30?'active':'','data-days="30"')}</div><span class="tiny muted">${add(today,1-S.stat)} – ${today}</span></div><div class="kpis">${kpi('야간 수면 평균',pretty(v.night),`${v.nightCount}건의 완료 기록 기준`)}${kpi('낮잠 1회 평균',pretty(v.nap),`${v.napCount}회 기준`,'orange')}${kpi('야간 수면 기록일',`${v.nightDays}일`,`전체 ${S.stat}일 중`,'green')}${kpi('낮잠 횟수',`${v.napCount}회`,'야간 평균과 별도','blue')}</div><div class="stats-grid"><section class="panel"><div class="panel-head"><strong>날짜별 수면시간</strong><div class="tag-group"><span class="legend"><i class="dot"></i>야간</span><span class="legend"><i class="dot nap"></i>낮잠</span></div></div><div class="panel-body">${statsBars(Math.min(14,S.stat))}<p class="tiny muted">${S.stat>14?'최근 14일 그래프 표시 · 상단 평균은 30일 전체를 사용합니다.':'그래프를 클릭하면 일별 기록으로 이동합니다.'}</p></div></section><div class="stack"><section class="panel"><div class="panel-head"><strong>수면 시간 분포</strong></div><div class="panel-body">${[['6시간 미만',a.filter(r=>r.kind==='night'&&period(r)<360).length],['6~8시간',a.filter(r=>r.kind==='night'&&period(r)>=360&&period(r)<480).length],['8시간 이상',a.filter(r=>r.kind==='night'&&period(r)>=480).length]].map(([l,vv])=>`<div class="progress-row"><b style="width:78px">${l}</b><div class="progress-track"><div class="progress-fill" style="width:${v.nightCount?vv/v.nightCount*100:0}%"></div></div><span>${vv}건</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><strong>통계 기준</strong></div><div class="panel-body"><p class="tiny muted" style="line-height:1.9">야간 수면은 완료된 기록의 평균, 낮잠은 1회 평균으로 계산합니다. 기록되지 않은 날은 0시간으로 보정하지 않습니다.</p><div class="hint">기존 Sleep Metrics API 계약은 구현 단계에서 그대로 유지합니다.</div></div></section></div></div>`}
function setting(key,label){let v=S.settings[key];return `<section class="panel"><div class="panel-head"><strong>${label} 기록 알림</strong><button class="toggle ${v.enabled?'on':''}" data-action="toggle-alarm" data-key="${key}" aria-label="${label} 알림 켜기/끄기"></button></div><div class="panel-body"><div class="form-row"><label class="edit-field"><span>기본 알림 시각</span><input type="time" data-setting="${key}" data-field="time" value="${v.time}"></label><label class="edit-field"><span>알림 방식</span><select data-setting="${key}" data-field="profile">${['무음','진동','소리','소리 + 진동'].map(n=>`<option ${n===v.profile?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="edit-field"><span>반복 요일</span><div class="row">${['월','화','수','목','금','토','일'].map((n,i)=>`<button class="weekday ${v.days.includes(i+1)?'active':''}" data-action="toggle-day" data-key="${key}" data-day="${i+1}">${n}</button>`).join('')}</div></div><p class="tiny muted">설정 변경은 웹에서 공유 설정으로 저장되며 실제 알림은 Android에서 실행됩니다.</p></div></section>`}
function settings(){return `${title('SLEEP / SETTINGS','수면 설정','기존의 취침·기상 알림 정책은 유지하며 PC에서 편집하기 편하게 구성합니다.',btn('save-settings','공유 설정 저장','primary'))}<div class="setting-group">${setting('bed','취침')}${setting('wake','기상')}</div><section class="panel" style="margin-top:15px"><div class="panel-head"><strong>Android 연동 및 기록 추천</strong></div><div class="panel-body"><div class="hint">휴대폰 사용 이력 기반 추천, OS 알림 권한, 백그라운드 알림 실행, 미전송 로컬 Outbox는 Android 기능입니다. Web은 서버에 반영된 수면 기록만 표시하며 Android에서 미전송된 내용을 완료로 표시하지 않습니다.</div></div></section>`}

const icTypes={night:'야간 수면',nap:'낮잠',workout:'운동',calendar:'Calendar SYS 일정'};
function icAll(){return [...S.records,...integratedWorkouts,...calendarSysBlocks]}
function icFind(id,kind){return (kind==='calendar'?calendarSysBlocks:kind==='workout'?integratedWorkouts:S.records).find(r=>r.id===id)}
function icRange(){let start=I.mode==='day'?I.day:I.mode==='week'?I.week:I.month+'-01';let count=I.mode==='day'?1:7;return {start,count,dates:Array.from({length:count},(_,i)=>add(start,i))}}
function icClock(s){return s.slice(11,16)}
function icRangeText(r){return `${r.start.slice(5,16).replace('T',' ')} → ${r.end.slice(5,16).replace('T',' ')}`}
function icDayMinutes(d){return mins(d+'T00:00')}
function icSegs(d){let left=icDayMinutes(d),end=left+1440;return icAll().filter(r=>I.filters[r.kind]&&mins(r.start)<end&&mins(r.end)>left).map(r=>({r,lo:Math.max(0,mins(r.start)-left),hi:Math.min(1440,mins(r.end)-left)})).sort((a,b)=>a.lo-b.lo)}
function icPanel(){
 if(I.selected?.kind==='calendar'){
   const r=icFind(I.selected.id,'calendar');
   if(r)return `<section class="panel ic-inspector"><div class="panel-head"><strong>Calendar SYS 일정 상세</strong><span class="tag muted">읽기 전용</span></div><div class="panel-body"><div class="ic-origin">원본 앱: Calendar SYS<small>${safe(r.sourceId)}</small></div><h3 class="ic-detail-title">${safe(r.title)}</h3><div class="ic-change"><small>시작 → 종료</small><strong>${safe(icRangeText(r))}</strong></div><div class="summary-line"><span>소요시간</span><b>${pretty(period(r))}</b></div><div class="summary-line"><span>분류</span><span>${safe(r.category)}</span></div><p class="ic-readonly-note">일정은 시간표의 보조 정보로 압축 표시합니다. 실제 구현에서는 Calendar SYS의 기존 원본 ID·조회 계약을 재사용하고, 수정은 원본 Calendar SYS로 이동해 처리합니다. 이 HTML은 DB 연결이 없는 검토용 샘플입니다.</p>${btn('ic-cancel','상세 닫기','subtle full')}</div></section>`;
 }
 if(I.drag){const dr=I.drag,record=icFind(dr.id,dr.kind);return `<section class="panel ic-inspector"><div class="panel-head"><strong>시간 변경 미리보기</strong><span class="tag pending">저장 전</span></div><div class="panel-body"><p class="tiny muted">원본 ID ${safe(record?.id)} · ${icTypes[dr.kind]} · 변경 전/후 확인</p><div class="ic-change"><small>기존 시각</small><strong>${safe(icRangeText(record))}</strong></div><div class="ic-change proposed"><small>수정 시각</small><strong>${safe(icRangeText(dr))}</strong></div><div class="summary-line"><span>변경 후 시간</span><b>${pretty(period(dr))}</b></div><div class="row ic-editor-actions">${btn('ic-save-drag','변경 저장','primary')}${btn('ic-edit-drag','직접 수정','subtle')}${btn('ic-cancel','취소','subtle')}</div><p class="tiny muted">저장하면 수면 기록은 수면 메뉴에도 반영됩니다. 실제 서비스에서는 원본 도메인 API와 revision 확인을 거칩니다.</p></div></section>`;}
 if(I.draft){let r=I.draft;return `<section class="panel ic-inspector"><div class="panel-head"><strong>${icTypes[r.kind]} 기록 수정</strong>${btn('ic-cancel','×','icon')}</div><div class="panel-body"><div class="ic-origin">원본 앱: ${r.kind==='workout'?'POS 운동':'Sleep'} <small>ID ${safe(r.id)}</small></div><label class="ic-label">시작 날짜·시각<input class="field" type="datetime-local" data-ic-edit="start" value="${safe(r.start)}"></label><label class="ic-label">종료 날짜·시각<input class="field" type="datetime-local" data-ic-edit="end" value="${safe(r.end)}"></label><div class="ic-change proposed"><small>계산된 시간</small><strong id="ic-length">${pretty(period(r))}</strong></div><div class="row ic-editor-actions">${btn('ic-save-edit','변경 저장','primary')}${btn('ic-cancel','취소','subtle')}</div><p class="tiny muted">자정 이후까지 이어지는 수면도 하나의 원본으로 유지합니다. 저장 실패·충돌 시에는 변경 전 값을 보존합니다.</p></div></section>`;}
 if(I.selected){let r=icFind(I.selected.id,I.selected.kind);if(r)return `<section class="panel ic-inspector"><div class="panel-head"><strong>${icTypes[r.kind]} 상세</strong><span class="tag muted">${r.kind==='workout'?'POS 운동':'Sleep'}</span></div><div class="panel-body"><h3 class="ic-detail-title">${safe(r.title||icTypes[r.kind])}</h3><div class="ic-change"><small>시작 → 종료</small><strong>${safe(icRangeText(r))}</strong></div><div class="summary-line"><span>시간</span><b>${pretty(period(r))}</b></div><div class="summary-line"><span>원본 ID</span><span>${safe(r.id)}</span></div><div class="summary-line"><span>원본</span><span>${r.kind==='workout'?'POS 운동':'Sleep · 동일 기록'}</span></div>${btn('ic-open-edit','시각 수정','primary full')}<p class="tiny muted">수면 메뉴와 통합 캘린더가 같은 예시 원본을 가리킵니다. 복제된 수면 기록은 만들지 않습니다.</p></div></section>`;}
 return `<section class="panel ic-inspector"><div class="panel-head"><strong>일정 상세·시간 수정</strong><span class="tag muted">선택 대기</span></div><div class="panel-body"><div class="ic-placeholder">캘린더에서 수면·낮잠·운동 블록을 클릭하세요.<br>블록을 드래그하거나 위·아래 핸들을 조절하면 저장 전 변경안이 표시됩니다.</div><div class="ic-source-points"><div><i class="ic-dot night"></i>야간 수면 <span>Sleep</span></div><div><i class="ic-dot nap"></i>낮잠 <span>Sleep</span></div><div><i class="ic-dot workout"></i>운동 <span>POS 운동</span></div><div><i class="ic-dot calendar"></i>보조 일정 <span>Calendar SYS</span></div></div></div></section>`;
}
function icGrid(){const {dates,count}=icRange();const step=27,px=step/60,dayNames=['일','월','화','수','목','금','토'];return `<div class="ic-grid-scroll"><div class="ic-grid" style="--ic-cols:${count};--ic-hour:${step}px"><div class="ic-axis ic-head">시각</div>${dates.map(d=>`<div class="ic-dayhead ${d===today?'today':''}"><b>${d.slice(5)} (${weekDay(d)})</b><span>${d===today?'오늘':'하루 00:00 – 24:00'}</span></div>`).join('')}<div class="ic-axis ic-vertical">${Array.from({length:13},(_,i)=>`<span style="top:${i*2*step}px">${fmt(i*2)}:00</span>`).join('')}</div>${dates.map(d=>`<div class="ic-col ${d===today?'today':''}" data-ic-date="${d}">${icSegs(d).map(({r,lo,hi})=>{let splitStart=mins(r.start)<icDayMinutes(d),splitEnd=mins(r.end)>icDayMinutes(d)+1440;let actualMinutes=hi-lo,workout=r.kind==='workout';let h=workout?Math.max(96,actualMinutes*px*1.65):Math.max(18,actualMinutes*px),compact=h<42;if(r.kind==='calendar'){
 let height=Math.min(35,Math.max(24,actualMinutes*px*.55));
 let guideHeight=Math.max(2,actualMinutes*px);
 return `<div class="ic-external-duration" aria-hidden="true" style="top:${lo*px}px;height:${guideHeight}px"></div><div role="button" tabindex="0" class="ic-event calendar ${I.selected?.id===r.id?'selected':''}" data-ic-id="${safe(r.id)}" data-ic-kind="calendar" data-ic-day="${d}" title="${safe(r.title+' · '+icRangeText(r)+' · Calendar SYS')}" aria-label="Calendar SYS ${safe(r.title+' '+icRangeText(r))}" style="top:${lo*px}px;height:${height}px"><span class="ic-cal-caption">${safe(r.title)}</span><small>${icClock(r.start)}</small></div>`;
 }return `<div role="button" tabindex="0" class="ic-event ${r.kind} ${workout?'ic-event-zoom':''} ${I.selected?.id===r.id?'selected':''}" data-ic-id="${safe(r.id)}" data-ic-kind="${r.kind}" data-ic-day="${d}" title="${safe(icTypes[r.kind]+' '+icRangeText(r))}" aria-label="${safe(icTypes[r.kind]+' '+icRangeText(r))}" style="top:${lo*px}px;height:${h}px">${!splitStart?'<span class="ic-handle start" data-ic-edge="start"></span>':''}${workout?`<span class="ic-workout-topline"><span class="ic-workout-type">운동 기록</span><span class="ic-workout-badge">확대 표시</span></span><b class="ic-workout-title">${safe(r.title||'운동')}</b><small class="ic-workout-time">${icClock(fromMins(icDayMinutes(d)+lo))} – ${hi===1440?'24:00':icClock(fromMins(icDayMinutes(d)+hi))}</small><span class="ic-workout-bottom"><strong>${pretty(period(r))}</strong><span>${safe(r.status||'기록')}</span></span><span class="ic-true-range" style="height:${Math.min(h-8,Math.max(9,actualMinutes*px))}px" title="실제 시간축 구간"></span>`:`<b>${splitStart?'↳ ':''}${safe(r.title||icTypes[r.kind])}</b><small>${icClock(fromMins(icDayMinutes(d)+lo))} – ${hi===1440?'24:00':icClock(fromMins(icDayMinutes(d)+hi))}</small>${!compact?`<em>${pretty(period(r))}${splitEnd?' · 다음 날까지':''}</em>`:''}`}${!splitEnd?'<span class="ic-handle end" data-ic-edge="end"></span>':''}</div>`}).join('')}</div>`).join('')}</div></div>`}
function icMonth(){let m=I.month,start=m+'-01',offset=dateOf(start).getUTCDay(),count=new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate();const cells=Math.ceil((offset+count)/7)*7,first=add(start,-offset);return `<div class="ic-month"><div class="ic-month-weekdays">${names.map(n=>`<span>${n}</span>`).join('')}</div><div class="ic-month-cells">${Array.from({length:cells},(_,i)=>{let d=add(first,i),items=icSegs(d);return `<button class="ic-month-cell ${d.slice(0,7)!==m?'outside':''} ${d===today?'today':''}" data-action="ic-day" data-date="${d}"><b>${+d.slice(8)}</b>${items.filter(({r})=>r.kind!=='calendar').slice(0,3).map(({r})=>`<span class="ic-month-entry ${r.kind}">${r.kind==='workout'?'운동':r.kind==='nap'?'낮잠':'수면'} · ${r.kind==='workout'?(r.title||'운동'):pretty(period(r))}</span>`).join('')}${items.filter(({r})=>r.kind!=='calendar').length>3?`<small>외 ${items.filter(({r})=>r.kind!=='calendar').length-3}건</small>`:''}${items.some(({r})=>r.kind==='calendar')?`<span class="ic-month-external">일정 ${items.filter(({r})=>r.kind==='calendar').length}건</span>`:''}<div class="ic-month-hour">${items.map(({r,lo,hi})=>`<i class="${r.kind}" style="left:${lo/1440*100}%;width:${(hi-lo)/1440*100}%"></i>`).join('')}</div></button>`}).join('')}</div></div>`;}

function eventClick(e){let n=e.target.closest('[data-action]');if(!n)return;let a=n.dataset.action;if(a.startsWith('ic-')){icAction(n);return;}switch(a){case 'navigate':changePage(n.dataset.page);break;case 'tab':S.tab=n.dataset.tab;S.drag=null;S.editor=null;render();break;case 'go-week':S.page='records';S.tab='weekly';S.week=add(today,-6);S.editor=null;render();break;case 'review-suggestion':S.page='records';S.tab='daily';S.date=today;S.editor=null;S.drag=null;render();break;case 'go-day':case 'select-month-day':S.date=n.dataset.date;S.page='records';S.tab='daily';S.editor=null;render();break;case 'select-day':S.date=n.dataset.date;S.editor=null;render();break;case 'shift-day':S.date=add(S.date,+n.dataset.step);S.editor=null;render();break;case 'shift-week':S.week=add(S.week,+n.dataset.step);S.editor=null;S.drag=null;render();break;case 'shift-month':S.month=monthShift(S.month,+n.dataset.step);render();break;case 'month-current':S.month=today.slice(0,7);render();break;case 'week-current':S.week=add(today,-6);render();break;case 'new':openEditor(n.dataset.kind||'night',null,n.dataset.reco==='1');break;case 'edit':if(pointer?.moved)return;openEditor('night',n.dataset.id);break;case 'save-edit':saveEditor();break;case 'cancel-edit':S.editor=null;render();break;case 'delete-edit':if(confirm('이 기록을 목업에서 삭제하시겠습니까?')){S.records=S.records.filter(r=>r.id!==S.editor.id);S.editor=null;persist();render();message('기록을 삭제했습니다.');}break;case 'cancel-drag':S.drag=null;render();break;case 'save-drag':{if(!S.drag)break;const o=S.records.find(x=>x.id===S.drag.id);if(!o)break;const proposal={...o,start:S.drag.start,end:S.drag.end},error=validate(proposal);if(error){message(error);break;}if(period(proposal)>=1080&&!confirm('18시간 이상 기록입니다. 시작·종료 날짜와 시각이 정확한가요?'))break;S.records=S.records.map(x=>x.id===proposal.id?proposal:x);S.drag=null;S.editor=null;persist();render();message('주간 그래프 수정 내역을 저장했습니다.');break;}case 'apply-drag':if(S.drag){let x=S.records.find(r=>r.id===S.drag.id);let m=S. document.addEventListener('pointerdown',e=>{let bar=e.target.closest('.ic-event');if(!bar||bar.dataset.icKind==='calendar'||e.button!==0)return;let r=icFind(bar.dataset.icId,bar.dataset.icKind);if(!r)return;let column=bar.closest('.ic-col');icPointer={id:r.id,kind:r.kind,originStart:r.start,originEnd:r.end,bar,sy:e.clientY,sx:e.clientX,originDay:column?.dataset.icDate,edge:e.target.dataset.icEdge||'move',moved:false};bar.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!icPointer)return;let p=icPointer,dy=e.clientY-p.sy;if(Math.abs(dy)+Math.abs(e.clientX-p.sx)>5)p.moved=true;if(!p.moved)return;p.bar.classList.add('dragging');p.bar.style.transform=`translate(${p.edge==='move'?e.clientX-p.sx:0}px,${dy}px)`;});
document.addEventListener('pointerup',e=>{if(!icPointer)return;let p=icPointer;icPointer=null;if(!p.moved){icSelect(p.id,p.kind);return;}let grid=p.bar.closest('.ic-grid'),h=parseFloat(getComputedStyle(grid).getPropertyValue('--ic-hour'))||40,delta=Math.round(((e.clientY-p.sy)/h*60)/15)*15;let shift=0;if(p.edge==='move'){let col=[...document.querySelectorAll('.ic-col')].find(c=>{let r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<r.right;});if(col)shift=(mins(col.dataset.icDate+'T00:00')-mins(p.originDay+'T00:00'));}let st=mins(p.originStart),en=mins(p.originEnd);if(p.edge==='start')st+=delta;else if(p.edge==='end')en+=delta;else{st+=delta+shift;en+=delta+shift;}let dr={id:p.id,kind:p.kind,start:fromMins(st),end:fromMins(en)};if(mins(dr.end)<=mins(dr.start)){render();message('종료는 시작 이후여야 합니다.');return;}I.selected={id:p.id,kind:p.kind};I.drag=dr;I.draft=null;icIgnoreClick=true;render();});
document.addEventListener('pointercancel',()=>{if(icPointer){icPointer=null;render()}});
document.addEventListener('click',e=>{if(icIgnoreClick){icIgnoreClick=false;return;}let bar=e.target.closest('.ic-event');if(bar)icSelect(bar.dataset.icId,bar.dataset.icKind)},true);

render();
})();
</script>
</body></html>
