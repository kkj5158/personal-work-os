allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java')) {
            def compile = tasks.register('qaAttentionLatencyCompile', JavaCompile) {
                source = files(new File(System.getenv('QA_TOOL_ROOT'), 'qa/AttentionLatencyInspect.java'))
                classpath = sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('qa-attention-latency')
            }
            tasks.register('qaAttentionLatencyInspect', JavaExec) {
                dependsOn compile
                classpath = files(compile.flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
                mainClass = 'AttentionLatencyInspect'
            }
        }
    }
}
