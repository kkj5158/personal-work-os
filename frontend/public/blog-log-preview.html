return `<article class="card post" data-id="${p.id}"><div class="post-head"><div class="avatar"></div><div><div class="flex center gap8"><span class="post-user">${safe(state.profile.name)}</span>${p.pinned?`<span class="pinned">${ico.pin}고정됨</span>`:''}</div><div class="post-meta">${when(p.createdAt)}</div></div><div class="post-actions"><button class="mini" data-act="edit" data-id="${p.id}" title="글 수정"><svg viewBox="0 0 24 24"><path d="m4 16-.5 4 4-.5L20 7a2 2 0 0 0-4-4L4 16z"/></svg></button><button class="mini" data-act="options" data-id="${p.id}" title="더 보기">${ico.more}</button></div></div><div class="post-text">${safe(p.text)}</div>${p.photos.length?`<div class="gallery ${p.photos.length===1?'single':''}">${p.photos.map((src,i)=>`<img src="${src}" alt="${safe(state.profile.name)}님의 사진 ${i+1}" data-act="lightbox" data-id="${p.id}" data-idx="${i}"/>`).join('')}</div>`:''}<div class="post-footer"><button class="action" data-act="comments" data-id="${p.id}">${ico.msg} 댓글 ${count(p)}</button>${p.photos.length?`<span class="action" style="cursor:default">${ico.photo} 사진 ${p.photos.length}</span>`:''}<span class="footer-spacer"></span><button class="action ${p.saved?'active':''}" data-act="save" data-id="${p.id}">${ico.bookmark} ${p.saved?'보관됨':'보관'}</button></div>${comments.length?`<div class="comment-box">${shown.map(c=>`<div class="comment"><div class="avatar small"></div><div class="comment-body"><div class="head"><strong>${safe(state.profile.name)}</strong><span>${when(c.createdAt)}</span><button class="mini" style="margin-left:auto;width:20px;height:20px" title="댓글 삭제" data-act="delete-comment" data-id="${p.id}" data-cid="${c.id}">${ico.close}</button></div><p>${safe(c.text)}</p></div></div>`).join('')}${comments.length>1?`<button class="toolbtn" data-act="comments" data-id="${p.id}">${show?'댓글 접기':`댓글 ${comments.length-1}개 더 보기`} ${show?'⌃':'⌄'}</button>`:''}</div>`:''}<div class="comment-form"><input data-comment-id="${p.id}" aria-label="댓글 입력" placeholder="이 기록에 생각 이어 쓰기…" maxlength="3000"/><button class="secondary" data-act="reply" data-id="${p.id}">댓글 달기</button></div></article>`}).join(''):`<div class="card empty">${ico.msg}<div>조건에 맞는 기록이 없습니다.</div><small>새 글을 작성하거나 필터를 바꿔보세요.</small></div>`;
const recent=[...all].sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);$('#recent').innerHTML=recent.map(p=>`<div class="tl-item"><b>${when(p.createdAt)}</b><p>${safe(p.text.replace(/\n/g,' '))}</p></div>`).join('')||'<span style="color:#9aa6b6;font-size:12px">아직 기록이 없습니다.</span>';
$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===mode));}
function heat(){let bits=Array.from({length:98},(_,i)=>{let n=(i*17+11)%13;return `<span class="${n===0?'h3':n<3?'h2':n<6?'h1':''}" title="활동 밀도 예시"></span>`}).join('');$('#heat').innerHTML=bits}
function previews(){$('#image-previews').innerHTML=photos.map((s,i)=>`<div class="thumb"><img src="${s}" alt="첨부 사진 ${i+1}"/><button type="button" data-remove-photo="${i}" aria-label="첨부 삭제">×</button></div>`).join('')}
function addPost(){const text=$('#compose').value.trim();if(!text&&!photos.length)return toast('내용이나 사진을 추가해 주세요.');const item={id:uid(),text,photos:[...photos],createdAt:Date.now(),comments:[],pinned:false,saved:false};state.posts.unshift(item);state.draft='';$('#compose').value='';photos=[];previews();mode='all';filter='all';query='';$('#search').value='';persist();render();toast('새 기록을 게시했습니다.')}
function dialog(inner){$('#modals').innerHTML=`<div class="pop" id="dialog-overlay"><div class="dialog" role="dialog" aria-modal="true">${inner}</div></div>`;$('#dialog-overlay').addEventListener('click',e=>{if(e.target.id==='dialog-overlay')close()})}
function close(){$('#modals').innerHTML='';activeEdit=null}
function editProfile(){dialog(`<h2>프로필 편집</h2><p>Blog 안에서 표시할 이름과 소개를 설정합니다.</p><label for="new-name">표시 이름</label><input id="new-name" maxlength="35" value="${safe(state.profile.name)}"/><label for="new-bio">소개</label><textarea id="new-bio" maxlength="240">${safe(state.profile.bio)}</textarea><div class="buttons"><button class="secondary" data-modal="close">취소</button><button class="primary" data-modal="save-profile">저장</button></div>`) }
function editPost(id){const p=state.posts.find(x=>x.id===id);if(!p)return;activeEdit=id;dialog(`<h2>기록 수정</h2><p>이미 작성한 글을 바로 수정할 수 있습니다.</p><textarea id="edit-text" style="height:170px">${safe(p.text)}</textarea><div class="buttons"><button class="secondary" data-modal="close">취소</button><button class="primary" data-modal="save-post">수정 완료</button></div>`)}
function options(id){activeEdit=id;const p=state.posts.find(x=>x.id===id);dialog(`<h2>기록 관리</h2><p>기록을 고정하거나 보관할 수 있습니다.</p><div style="display:grid;gap:8px"><button class="secondary" data-modal="toggle-pin">${p.pinned?'고정 해제':'타임라인 상단에 고정'}</button><button class="secondary" data-modal="toggle-save">${p.saved?'보관 취소':'보관한 글에 추가'}</button><button class="secondary danger" data-modal="delete-post">이 기록 삭제</button></div><div class="buttons"><button class="secondary" data-modal="close">닫기</button></div>`)}
function handleAction(target){const a=target.dataset.act,id=target.dataset.id,p=state.posts.find(x=>x.id===id);if(a==='use-draft'){$('#compose').value=state.draft;mode='all';render();window.scrollTo({top:0,behavior:'smooth'});$('#compose').focus()}if(a==='discard-draft'){state.draft='';persist();render();toast('임시글을 삭제했습니다.')}if(!p)return;if(a==='reply'){const inp=$(`[data-comment-id="${id}"]`);const v=inp?.value.trim();if(!v)return toast('댓글 내용을 입력해 주세요.');p.comments.push({id:uid(),text:v,createdAt:Date.now()});expanded.add(id);persist();render();toast('댓글을 추가했습니다.')}if(a==='comments'){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render()}if(a==='save'){p.saved=!p.saved;persist();render();toast(p.saved?'보관한 글에 추가했습니다.':'보관을 해제했습니다.')}if(a==='edit')editPost(id);if(a==='options')options(id);if(a==='delete-comment'){p.comments=p.comments.filter(c=>c.id!==target.dataset.cid);persist();render();toast('댓글을 삭제했습니다.')}if(a==='lightbox'){const src=p.photos[Number(target.dataset.idx)];$('#modals').innerHTML=`<div class="pop lightbox" id="lightbox"><img alt="확대된 기록 사진" src="${src}"/><button data-modal="close" aria-label="닫기">×</button></div>`;$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')close()})}}
$('#blog-entry').addEventListener('click',()=>{mode='all';filter='all';query='';$('#search').value='';render();window.scrollTo({top:0,behavior:'smooth'});toast('Blog · LOG 독립 화면입니다.')});
$('#submit-post').addEventListener('click',addPost);$('#save-draft').addEventListener('click',()=>{const v=$('#compose').value.trim();if(!v)return toast('임시저장할 내용을 입력해 주세요.');state.draft=v;persist();render();toast('임시저장했습니다.')});$('#image-add').addEventListener('click',()=>$('#photo-input').click());$('#photo-input').addEventListener('change',async e=>{const files=[...e.target.files].slice(0,Math.max(0,4-photos.length));for(const f of files){if(!f.type.startsWith('image/'))continue;const img=new Image();const raw=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)});if(!raw)continue;await new Promise(resolve=>{img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,1500/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photos.push(canvas.toDataURL('image/jpeg',.82));resolve()};img.onerror=resolve;img.src=raw})}e.target.value='';previews();if(photos.length>=4)toast('목업에서는 한 게시글에 사진 4장까지 지원합니다.')});
$('#image-previews').addEventListener('click',e=>{const b=e.target.closest('[data-remove-photo]');if(b){photos.splice(Number(b.dataset.removePhoto),1);previews()}});$('#search').addEventListener('input',e=>{query=e.target.value;render()});$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.nav;filter='all';render()}));
$('#feed').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)handleAction(t)});$('#feed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-comment-id]')){const id=e.target.dataset.commentId;handleAction({dataset:{act:'reply',id}})}});
$('#edit-profile').addEventListener('click',editProfile);$('#modals').addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;const a=b.dataset.modal;if(a==='close'){close();return}if(a==='save-profile'){const n=$('#new-name').value.trim();if(!n)return toast('이름을 입력해 주세요.');state.profile={name:n,bio:$('#new-bio').value.trim()};persist();close();render();toast('프로필을 저장했습니다.')}if(a==='save-post'){const p=state.posts.find(x=>x.id===activeEdit);if(!p)return;const t=$('#edit-text').value.trim();if(!t&&!p.photos.length)return toast('글 내용이 비어 있습니다.');p.text=t;persist();close();render();toast('기록을 수정했습니다.')}if(a==='toggle-pin'||a==='toggle-save'||a==='delete-post'){const p=state.posts.find(x=>x.id===activeEdit);if(!p)return;if(a==='toggle-pin')p.pinned=!p.pinned;if(a==='toggle-save')p.saved=!p.saved;if(a==='delete-post')state.posts=state.posts.filter(x=>x.id!==p.id);persist();close();render();toast(a==='delete-post'?'기록을 삭제했습니다.':'변경 사항을 저장했습니다.')}});
$('#export-btn').addEventListener('click',()=>{const data=JSON.stringify({exportedAt:new Date().toISOString(),profile:state.profile,posts:state.posts},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pos_log_records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON 백업 파일을 생성했습니다.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement===$('#compose'))addPost()});
$('#compose').value=state.draft||'';heat();previews();render();
})();
</script>
